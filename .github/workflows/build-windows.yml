
name: Build GamePilot for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: GamePilot_TestClient
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: GamePilot_TestClient
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GamePilot
          --collect-all PySide6
          --collect-all pyautogui
          --collect-all PIL
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GamePilot-Windows
          path: GamePilot_TestClient/dist/GamePilot.exe
